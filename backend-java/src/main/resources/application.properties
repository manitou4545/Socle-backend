# ============================================================
# Configuration par défaut : base H2 fichier, aucune installation
# requise. Le fichier de base de données est créé automatiquement
# dans ./data/socledb.mv.db au premier démarrage.
#
# ⚠️ SUR RENDER (et tout hébergeur avec disque éphémère) : cette base
# H2 est PERDUE à chaque redéploiement ou réveil du service gratuit.
# Pour des données qui persistent, définis les variables d'environnement
# ci-dessous sur Render (elles remplacent automatiquement les valeurs
# H2 par défaut, aucune modification de code nécessaire) :
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:<port>/<db>
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<password>
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
# (Base Postgres gratuite possible via Render, Neon ou Supabase.)
# ============================================================

spring.application.name=socle-backend
# Render impose son propre port via la variable d'environnement PORT
# (déjà gérée par le Dockerfile) : ne pas modifier cette ligne.
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/socledb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 (pratique pour inspecter les données pendant le développement)
# -> accessible sur http://localhost:8080/h2-console (JDBC URL ci-dessus)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# SECURITE ADMIN
# Empreinte BCrypt (déjà générée et vérifiée) du mot de passe :
# NZJG_manitou4545!@#$%^&admi1
# Tu peux déployer tel quel — rien à faire ici.
# ============================================================
socle.admin.password-hash=$2a$10$47xkIS2xJDuKS6kg4deToORVJoQMStHM0poKNg59RgoWxkPSvBlo6

# Origine autorisée pour les appels depuis le front-end (CORS).
# Mets à jour avec l'adresse réelle de ton site (Netlify, etc.)
socle.cors.allowed-origin=*

# ============================================================
# UPLOAD DE FICHIERS (PDF des mémoires/TPE)
# Limite relevée par rapport au défaut Spring (1 Mo) car un
# mémoire complet en PDF dépasse facilement cette taille.
# ============================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Identifiants Cloudinary (à définir en variables d'environnement,
# jamais en clair ici) : CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY,
# CLOUDINARY_API_SECRET

# ============================================================
# MICROSERVICE ANTI-PLAGIAT (Python)
# URL du service déployé séparément (ex: sur Render). Laisser vide
# en local si tu ne le lances pas : un score par défaut (90) sera
# utilisé à la place sans bloquer la publication.
# ============================================================
socle.plagiat.service-url=${PLAGIAT_SERVICE_URL:}
socle.plagiat.timeout-seconds=8

# ============================================================
# ASSISTANT MINIER (IA) — via Groq, gratuit (pas Anthropic direct
# depuis le navigateur : la clé doit rester côté serveur uniquement).
# Crée ta clé gratuite sur console.groq.com puis définis GROQ_API_KEY
# en variable d'environnement (jamais en clair ici).
# ============================================================
socle.groq.api-key=${GROQ_API_KEY:}
socle.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
